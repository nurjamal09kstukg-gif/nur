<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nurjamal | Tech Portfolio</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text: #f1f5f9;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            padding: 40px 0;
            background: linear-gradient(to bottom, #1e293b, #0f172a);
            text-align: center;
            border-bottom: 1px solid #334155;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            background: #1e293b;
            padding: 5px;
            border-radius: 12px;
            display: inline-flex;
        }

        .tab-btn {
            padding: 10px 25px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: #94a3b8;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .tab-btn.active {
            background: var(--accent);
            color: var(--bg);
        }

        .container {
            width: 90%;
            max-width: 800px;
            display: none;
            padding-bottom: 50px;
        }

        .container.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 25px;
            border: 1px solid #334155;
        }

        h3 { color: var(--accent); margin-top: 0; }

        /* AI Section */
        .upload-zone {
            border: 2px dashed #334155;
            padding: 30px;
            text-align: center;
            border-radius: 12px;
            cursor: pointer;
            display: block;
        }
        #audio-upload { display: none; }
        .btn-main {
            background: var(--accent);
            color: var(--bg);
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            margin-top: 15px;
            display: inline-block;
        }

        .bar-bg { background: #334155; height: 8px; border-radius: 4px; overflow: hidden; margin-top: 5px; }
        .bar-fill { background: var(--accent); height: 100%; transition: width 0.5s; }

        video, iframe { width: 100%; border-radius: 12px; margin-top: 10px; border: none; }
        .iframe-container { position: relative; padding-bottom: 56.25%; height: 0; }
        .iframe-container iframe { position: absolute; top:0; left:0; width:100%; height:100%; }

        .contacts-footer {
            background: #1e293b;
            width: 100%;
            padding: 40px 0;
            text-align: center;
            border-top: 1px solid #334155;
        }
        .contacts-footer a { color: var(--accent); text-decoration: none; margin: 0 15px; font-weight: bold; }
    </style>
</head>
<body>

<header>
    <h1>🎬 Nurjamal Digital Space</h1>
    <div class="tabs">
        <button class="tab-btn active" onclick="openTab('works')">Мои работы</button>
        <button class="tab-btn" onclick="openTab('ai-lab')">AI Лаборатория</button>
    </div>
</header>

<div id="works" class="container active">
    
    <div class="card">
        <h3>📺 YouTube Видео 1</h3>
        <div class="iframe-container">
            <iframe src="https://www.youtube.com/embed/rNhHJYa-ZAQ" allowfullscreen></iframe>
        </div>
    </div>

    <div class="card">
        <h3>📺 YouTube Видео 2</h3>
        <div class="iframe-container">
            <iframe src="https://www.youtube.com/embed/O1ThGoCa0HE" allowfullscreen></iframe>
        </div>
    </div>

    <div class="card">
        <h3>🎥 scratch3.mov</h3>
        <video controls>
            <source src="scratch3.mov" type="video/quicktime">
        </video>
    </div>

    <div class="card">
        <h3>🎥 nurjamal1.mp4</h3>
        <video controls>
            <source src="nurjamal1.mp4" type="video/mp4">
        </video>
    </div>

    <div class="card">
        <h3>🎥 nurja1.mp4</h3>
        <video controls>
            <source src="nurja1.mp4" type="video/mp4">
        </video>
    </div>

</div>

<div id="ai-lab" class="container">
    <div class="card">
        <h3>🎵 Музыкальный AI-Анализатор</h3>
        <p>Загрузите аудио, чтобы нейросеть определила жанр и инструменты.</p>
        
        <label for="audio-upload" class="upload-zone">
            <p id="status-text">Нажмите, чтобы выбрать аудиофайл</p>
            <div class="btn-main">Выбрать файл</div>
            <input type="file" id="audio-upload" accept="audio/*">
        </label>

        <div id="ai-results" style="margin-top: 20px;"></div>
    </div>
</div>

<footer class="contacts-footer">
    <h3>📡 Контакты</h3>
    <a href="tel:+996554701570">📞 Позвонить</a>
    <a href="https://t.me/+996554701570">✈️ Telegram</a>
    <a href="mailto:nurjamal@gmail.com">📧 Email</a>
</footer>

<script type="module">
    import { pipeline } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';

    window.openTab = function(tabId) {
        document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    const statusText = document.getElementById('status-text');
    const aiResults = document.getElementById('ai-results');
    const fileInput = document.getElementById('audio-upload');
    let classifier;

    fileInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        statusText.innerText = "⏳ Загрузка AI-модели...";
        aiResults.innerHTML = "";

        try {
            if (!classifier) {
                classifier = await pipeline('audio-classification', 'Xenova/ast-finetuned-audioset-10-10-0.4593');
            }

            statusText.innerText = "🔍 Анализ аудио...";
            
            const reader = new FileReader();
            reader.onload = async (event) => {
                const output = await classifier(event.target.result);
                statusText.innerText = "✅ Готово!";
                
                aiResults.innerHTML = output.slice(0, 3).map(item => `
                    <div style="margin-bottom:15px">
                        <div style="display:flex; justify-content:space-between; font-size: 0.9em;">
                            <span>${item.label}</span>
                            <span>${(item.score * 100).toFixed(1)}%</span>
                        </div>
                        <div class="bar-bg"><div class="bar-fill" style="width: ${item.score * 100}%"></div></div>
                    </div>
                `).join('');
            };
            reader.readAsDataURL(file);
        } catch (err) {
            statusText.innerText = "❌ Ошибка";
            console.error(err);
        }
    });
</script>

</body>
</html>
